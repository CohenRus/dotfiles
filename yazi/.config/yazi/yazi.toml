[mgr]
ratio = [1, 4, 3]
sort_sensitive = false
sort_dir_first = true
show_symlink = true
mouse_events = ["scroll"]
linemode = "size_and_mtime"
sort_by = "natural"

[preview]
wrap = "yes"
tab_size = 4
max_width = 1080
max_height = 1620

[plugin]
prepend_previewers = [
  { url = "*.docx", run = "office" },
  { url = "*.pptx", run = "office" },
  { url = "*.xlsx", run = "office" },
  { url = "*.zip",  run = "lsar" },
  { url = "*.tar",  run = "lsar" },
  { url = "*.7z",   run = "lsar" },
  { url = "*.rar",  run = "lsar" },
  { url = "*.tar.gz", run = "lsar" },
]

[input]
cursor_blink = false

[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open with default system app" },
]
zed = [
  { run = 'zed %s1', orphan = true, desc = "Open in Zed" },
]
reveal = [
  { run = 'dolphin --select %s1', orphan = true, desc = "Reveal in Dolphin" },
]
play = [
  { run = 'mpv %s', orphan = true, desc = "Play media" },
]
extract = [
  # Uses your installed KDE Ark to extract here (or use 'unar' if you install it)
  { run = 'ark -b %s1', orphan = true, desc = "Extract with Ark" },
]
office = [
  { run = 'libreoffice %s', orphan = true, desc = "Open in LibreOffice" },
]
lsar = [
  { run = 'lsar %s1', block = true, desc = "List archive contents", for = "unix" },
]
# Added PDF opener (change 'okular' if you use a different reader)
pdf = [
  { run = 'okular %s1', orphan = true, desc = "Open in Okular" },
]

[open]
rules = [
    # PDF (MIME and extension fallback)
    { mime = "application/pdf", use = [ "pdf", "open", "reveal" ] },
    { url = "*.pdf", use = [ "pdf", "open", "reveal" ] },

    # Text
    { mime = "text/*", use = [ "edit", "zed", "reveal" ] },
    # Image
    { mime = "image/*", use = [ "open", "zed", "reveal" ] },
    # Media
    { mime = "{audio,video}/*", use = [ "play", "zed", "reveal" ] },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "zed", "reveal" ] },
    # JSON
    { mime = "application/{json,ndjson}", use = [ "edit", "zed", "reveal" ] },
    # JavaScript
    { mime = "*/javascript", use = [ "edit", "zed", "reveal" ] },
    # Empty file
    { mime = "inode/empty", use = [ "edit", "zed", "reveal" ] },
    # Fallback
    { mime = "*", use = [ "open", "zed", "reveal" ] },
]
